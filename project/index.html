<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Preview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1>Border Preview</h1>
	</header>
	<main>
		<!-- OUTPUT CONTAINER -->
		<div class="container">
			<h1>Border</h1>
			<p>Radius</p>
			<label>Top Left</label>
			<div class="miniGrid">
				<span id="showTopLeft">0</span>
				<input id="TopLeft" class="borderSlider" type="range" min="0" max="360" value="0"/>
			</div>
			<label>Bottom Left</label>
			<div class="miniGrid">
				<span id="showBottomLeft">0</span>
				<input id="BottomLeft" class="borderSlider" type="range" min="0" max="360" value="0"/>
			</div>
			<label>Top Right</label>
			<div class="miniGrid">
				<span id="showTopRight">0</span>
				<input id="TopRight" class="borderSlider" type="range" min="0" max="360" value="0"/>
			</div>
			<label>Bottom Right</label>
			<div class="miniGrid">
				<span id="showBottomRight">0</span>
				<input id="BottomRight" class="borderSlider" type="range" min="0" max="360" value="0"/>
			</div>
			<!---->
			<p>Colors</p>
			<label>Red</label>
			<div class="miniGrid">
				<span id="showred">0</span>
				<input id="red" class="colorSlider" type="range" min="0" max="255" value="0"/>
			</div>
			<label>Green</label>
			<div class="miniGrid">
				<span id="showgreen">0</span>
				<input id="green" class="colorSlider" type="range" min="0" max="255" value="0"/>
			</div>
			<label>Blue</label>
			<div class="miniGrid">
				<span id="showblue">0</span>
				<input id="blue" class="colorSlider" type="range" min="0" max="255" value="0"/>
			</div>
			<!---->
			<p>Border Thickness</p>
			<div class="miniGrid">
				<span id="showthickness">0</span>
				<input id="thickness" type="range" min="1" max="50" value="0"/>
			</div>
		</div>
		<!-- OUTPUT CONTAINER -->
		<div class="container output">
			<div id="toBeModded"></div>
		</div>
	</main>
<script src="scripts.js">
</script>
</body>
</html>
